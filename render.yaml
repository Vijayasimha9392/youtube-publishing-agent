services:
  - type: web
    name: youtube-publishing-agent
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/dashboard/stats
    envVars:
      - key: PORT
        value: 10000
      - key: MONITORED_FOLDER
        value: /app/clips
      - key: AUTO_DELETE_ON_PUBLISH
        value: "true"
