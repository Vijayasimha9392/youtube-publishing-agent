services:
  - type: web
    name: youtube-publishing-agent
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/dashboard/stats
    envVars:
      - key: PORT
        value: 10000
      - key: MONITORED_FOLDER
        value: /app/clips
      - key: AUTO_DELETE_ON_PUBLISH
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: youtube-agent-db
          property: connectionString

databases:
  - name: youtube-agent-db
    plan: free
    region: oregon
    databaseName: youtube_agent
    user: youtube_admin
